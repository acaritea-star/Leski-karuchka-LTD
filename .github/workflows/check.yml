name: Check
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node scripts/check-legal-source.mjs
      - run: npx --yes deno@2.5.4 check supabase/functions/*/index.ts
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test
